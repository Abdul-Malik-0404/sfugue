<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFUgue Testbed</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Use Mediasoup Client v3 -->
    <script src="https://cdn.jsdelivr.net/npm/mediasoup-client@3/umd/mediasoup-client.min.js"></script>
  </head>
  <body>
    <h1>SFUgue Local Testbed</h1>
    <div>
      <h3>Local Video (Producer)</h3>
      <video
        id="localVideo"
        autoplay
        muted
        playsinline
        style="width: 320px; background: black"
      ></video>
    </div>
    <div>
      <h3>Remote Video (Consumer)</h3>
      <video
        id="remoteVideo"
        autoplay
        playsinline
        style="width: 320px; background: black"
      ></video>
    </div>
    <button id="startBtn" type="button">Start Streaming</button>
    <pre id="statusLog" aria-live="polite"></pre>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get("roomId") || "";
      const peerIdHint = urlParams.get("peerId") || "";
      const statusEl = document.getElementById("statusLog");

      window.__sfugueMetrics = {
        roomId: roomId || "default",
        peerIdHint,
        startRequestedAtMs: null,
        firstRemoteFrameAtMs: null,
        ttffMs: null,
        consumedKinds: [],
        failoverEvents: [],
      };

      function logStatus(message) {
        console.log("[sfugue-client]", message);
        if (statusEl) {
          statusEl.textContent = message;
        }
      }

      function emitAsync(socket, eventName, payload) {
        return new Promise((resolve, reject) => {
          const handleAck = (response) => {
            if (response && response.error) {
              reject(new Error(response.error));
              return;
            }
            resolve(response);
          };

          if (payload === undefined) {
            socket.emit(eventName, handleAck);
          } else {
            socket.emit(eventName, payload, handleAck);
          }
        });
      }

      const socket = io();
      let device;
      let producerTransport;
      let consumerTransport;
      const producers = [];
      const consumers = [];

      socket.on("proactiveFailover", (directive) => {
        window.__sfugueMetrics.failoverEvents.push({
          ...directive,
          receivedAtMs: performance.now(),
        });
        logStatus(
          `Proactive evacuation directive received -> ${directive.targetSignalingUrl}`,
        );
      });

      const remoteVideoEl = document.getElementById("remoteVideo");
      remoteVideoEl.addEventListener(
        "playing",
        () => {
          if (window.__sfugueMetrics.firstRemoteFrameAtMs === null) {
            const now = performance.now();
            window.__sfugueMetrics.firstRemoteFrameAtMs = now;
            if (window.__sfugueMetrics.startRequestedAtMs !== null) {
              window.__sfugueMetrics.ttffMs =
                now - window.__sfugueMetrics.startRequestedAtMs;
            }
            logStatus(
              `Remote playback active (TTFF=${Math.round(window.__sfugueMetrics.ttffMs || 0)}ms)`,
            );
          }
        },
        { once: true },
      );

      document
        .getElementById("startBtn")
        .addEventListener("click", async () => {
          window.__sfugueMetrics.startRequestedAtMs = performance.now();
          logStatus("Requesting synthetic/local media...");

          // 1. Acquire video + audio (fallback to video-only when mic is unavailable)
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: true,
            });
          } catch {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
          }

          document.getElementById("localVideo").srcObject = stream;
          const tracks = stream.getTracks();

          // Optional room join when query params are provided (e.g., load-gen bots)
          if (roomId) {
            await emitAsync(socket, "joinRoom", {
              roomId,
              peerId: peerIdHint || undefined,
            });
          }

          // 2. Initialize Mediasoup Device
          const routerRtpCapabilities = await emitAsync(
            socket,
            "getRouterRtpCapabilities",
          );
          device = new window.mediasoupClient.Device();
          await device.load({ routerRtpCapabilities });

          // 3. Create & connect Producer Transport
          const sendParams = await emitAsync(socket, "createProducerTransport");
          producerTransport = device.createSendTransport(sendParams);

          producerTransport.on(
            "connect",
            ({ dtlsParameters }, callback, errback) => {
              emitAsync(socket, "connectProducerTransport", { dtlsParameters })
                .then(() => callback())
                .catch(errback);
            },
          );

          producerTransport.on("produce", (parameters, callback, errback) => {
            emitAsync(socket, "produce", {
              kind: parameters.kind,
              rtpParameters: parameters.rtpParameters,
            })
              .then(({ id }) => callback({ id }))
              .catch(errback);
          });

          // 4. Produce every captured track (VP8 video + Opus audio)
          const producedIds = [];
          for (const track of tracks) {
            const producer = await producerTransport.produce({ track });
            producers.push(producer);
            producedIds.push(producer.id);
          }

          // 5. Create & connect Consumer Transport
          const recvParams = await emitAsync(socket, "createConsumerTransport");
          consumerTransport = device.createRecvTransport(recvParams);

          consumerTransport.on(
            "connect",
            ({ dtlsParameters }, callback, errback) => {
              emitAsync(socket, "connectConsumerTransport", { dtlsParameters })
                .then(() => callback())
                .catch(errback);
            },
          );

          // 6. Consume and resume each produced track
          const remoteStream = new MediaStream();
          for (const producerId of producedIds) {
            const cParams = await emitAsync(socket, "consume", {
              rtpCapabilities: device.rtpCapabilities,
              producerId,
            });

            const consumer = await consumerTransport.consume({
              id: cParams.id,
              producerId: cParams.producerId,
              kind: cParams.kind,
              rtpParameters: cParams.rtpParameters,
            });
            consumers.push(consumer);
            remoteStream.addTrack(consumer.track);
            window.__sfugueMetrics.consumedKinds.push(consumer.kind);
          }

          remoteVideoEl.srcObject = remoteStream;
          await emitAsync(socket, "resume");
          logStatus(`Streaming active (${window.__sfugueMetrics.consumedKinds.join(", ")})`);
        });
    </script>
  </body>
</html>
