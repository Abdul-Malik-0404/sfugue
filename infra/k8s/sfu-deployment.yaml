# Mediasoup SFU deployments and NodePort services for Primary and Standby pods.
# Disjoint UDP hostPort partitions (40000-40005 vs 40006-40010) prevent port
# binding collisions on the single KinD node while preserving direct ICE UDP paths.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfu-primary
  namespace: default
  labels:
    app: sfu-primary
    sfu-role: primary
    app.kubernetes.io/part-of: sfugue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sfu-primary
  template:
    metadata:
      labels:
        app: sfu-primary
        sfu-role: primary
        app.kubernetes.io/part-of: sfugue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sfu-node
          image: sfugue-sfu-node:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ID
              value: "sfu-primary"
            - name: SFU_ROLE
              value: "primary"
            - name: ANNOUNCED_IP
              value: "127.0.0.1"
            - name: RTC_MIN_PORT
              value: "40000"
            - name: RTC_MAX_PORT
              value: "40005"
            - name: CONTROL_PLANE_BROKER
              value: "kafka"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_CLIENT_ID
              value: "sfu-primary"
            - name: KAFKA_GROUP_ID
              value: "sfu-primary-group"
            - name: STANDBY_SIGNALING_URL
              value: "http://127.0.0.1:30001"
          ports:
            - name: http-signaling
              containerPort: 3000
              protocol: TCP
            - name: rtc-udp-40000
              containerPort: 40000
              hostPort: 40000
              protocol: UDP
            - name: rtc-udp-40001
              containerPort: 40001
              hostPort: 40001
              protocol: UDP
            - name: rtc-udp-40002
              containerPort: 40002
              hostPort: 40002
              protocol: UDP
            - name: rtc-udp-40003
              containerPort: 40003
              hostPort: 40003
              protocol: UDP
            - name: rtc-udp-40004
              containerPort: 40004
              hostPort: 40004
              protocol: UDP
            - name: rtc-udp-40005
              containerPort: 40005
              hostPort: 40005
              protocol: UDP
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: sfu-primary
  namespace: default
  labels:
    app: sfu-primary
    app.kubernetes.io/part-of: sfugue
spec:
  type: NodePort
  selector:
    app: sfu-primary
  ports:
    - name: http-signaling
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfu-standby
  namespace: default
  labels:
    app: sfu-standby
    sfu-role: standby
    app.kubernetes.io/part-of: sfugue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sfu-standby
  template:
    metadata:
      labels:
        app: sfu-standby
        sfu-role: standby
        app.kubernetes.io/part-of: sfugue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sfu-node
          image: sfugue-sfu-node:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ID
              value: "sfu-standby"
            - name: SFU_ROLE
              value: "standby"
            - name: ANNOUNCED_IP
              value: "127.0.0.1"
            - name: RTC_MIN_PORT
              value: "40006"
            - name: RTC_MAX_PORT
              value: "40010"
            - name: CONTROL_PLANE_BROKER
              value: "kafka"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_CLIENT_ID
              value: "sfu-standby"
            - name: KAFKA_GROUP_ID
              value: "sfu-standby-group"
          ports:
            - name: http-signaling
              containerPort: 3000
              protocol: TCP
            - name: rtc-udp-40006
              containerPort: 40006
              hostPort: 40006
              protocol: UDP
            - name: rtc-udp-40007
              containerPort: 40007
              hostPort: 40007
              protocol: UDP
            - name: rtc-udp-40008
              containerPort: 40008
              hostPort: 40008
              protocol: UDP
            - name: rtc-udp-40009
              containerPort: 40009
              hostPort: 40009
              protocol: UDP
            - name: rtc-udp-40010
              containerPort: 40010
              hostPort: 40010
              protocol: UDP
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: sfu-standby
  namespace: default
  labels:
    app: sfu-standby
    app.kubernetes.io/part-of: sfugue
spec:
  type: NodePort
  selector:
    app: sfu-standby
  ports:
    - name: http-signaling
      port: 3000
      targetPort: 3000
      nodePort: 30001
      protocol: TCP
